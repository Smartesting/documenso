name: documenso-tester-env

services:
  database:
    image: postgres:15
    container_name: tester-env-documenso-database
    volumes:
      - documenso_database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U documenso']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=documenso
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=documenso
    ports:
      - 54320:5432

  inbucket:
    image: inbucket/inbucket
    container_name: tester-env-documenso-mailserver
    ports:
      - 9005:9000
      - 2500:2500
      - 1100:1100

  redis:
    image: redis:8-alpine
    container_name: tester-env-documenso-redis
    ports:
      - 63790:6379
    volumes:
      - redis:/data

  minio:
    image: minio/minio
    container_name: tester-env-documenso-minio
    ports:
      - 9006:9002
      - 9007:9001
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: documenso
      MINIO_ROOT_PASSWORD: password
    entrypoint: sh
    command: -c 'mkdir -p /data/documenso && minio server /data --console-address ":9001" --address ":9002"'

volumes:
  minio:
  redis:
  documenso_database:
